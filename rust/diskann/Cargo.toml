[package]
name = "chroma-diskann"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[workspace]
resolver = "2"

[features]
default = []
chroma-client = ["dep:chroma", "dep:tokio"]

[dependencies]
chroma = { path = "../chroma", default-features = false, features = ["rustls"], optional = true }
tokio = { version = "1.41", features = ["rt-multi-thread"], optional = true }
diskann = { git = "https://github.com/microsoft/DiskANN.git", rev = "bceaf45dc6aa694485553816b448d7b8f55df393" }
diskann-disk = { git = "https://github.com/microsoft/DiskANN.git", rev = "bceaf45dc6aa694485553816b448d7b8f55df393" }
diskann-providers = { git = "https://github.com/microsoft/DiskANN.git", rev = "bceaf45dc6aa694485553816b448d7b8f55df393" }
diskann-vector = { git = "https://github.com/microsoft/DiskANN.git", rev = "bceaf45dc6aa694485553816b448d7b8f55df393" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
rand = "0.8"
tempfile = "3.14"

[[example]]
name = "chroma"
required-features = ["chroma-client"]